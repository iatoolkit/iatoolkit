[build-system]
requires = ["setuptools>=68", "wheel", "build"]
build-backend = "setuptools.build_meta"

[project]
name = "iatoolkit"
dynamic = ["version"]
requires-python = ">=3.13"
description = "IAToolkit"
readme = "readme.md"
license = "MIT"
authors = [{ name = "Fernando Libedinsky" }]

# Capabilities that carry a heavy dependency and that most deployments never
# turn on. Each of these was already being installed by hand into whatever
# environment happened to need it, which is why a clean install could not run
# the whole suite: nothing declared them, so nothing could install them on
# purpose. Declared here, `pip install iatoolkit[ocr]` is a decision instead of
# a memory.
dependencies = [
  "bcrypt==4.2.1",
  "anthropic>=0.83.0",
  "boto3==1.43.10",
  "botocore==1.43.10",
  "braintrust>=0.17.0",
  "build==1.2.2.post1",
  "click==8.1.8",
  "cryptography==44.0.3",
  "Flask==3.1.0",
  "Flask-Bcrypt==1.0.1",
  "flask-cors==6.0.0",
  "Flask-Injector==0.15.0",
  "Flask-Session==0.8.0",
  "flatbuffers==24.3.25",
  "gevent==25.9.1",
  "google-ai-generativelanguage==0.6.15",
  "google-api-core==2.24.1",
  "google-api-python-client==2.161.0",
  "google-auth>=2.46.0",
  "google-auth-httplib2==0.2.0",
  "google-auth-oauthlib==1.2.1",
  "google-cloud-core==2.4.1",
  "google-cloud-storage==3.0.0",
  # 1.6.0 publishes no cp313 wheel. This was the only pin in the whole
  # dependency set that Python 3.13 required moving.
  "google-crc32c==1.8.0",
  "google-genai==1.57.0",
  "google-resumable-media==2.7.2",
  "googleapis-common-protos==1.66.0",
  "gunicorn==23.0.0",
  "h11==0.14.0",
  "httpcore==1.0.7",
  "httplib2==0.22.0",
  "httptools==0.6.4",
  "httpx>=0.28.1,<1.0.0",
  "httpx-sse==0.4.0",
  "huggingface-hub>=0.16.4",
  "humanfriendly==10.0",
  "idna==3.10",
  "injector==0.22.0",
  "Jinja2==3.1.5",
  "langchain==0.3.19",
  "langchain-core==0.3.35",
  "langchain-text-splitters==0.3.6",
  "markdown2==2.5.3",
  "nh3==0.3.7",
  "openai==2.8.1",

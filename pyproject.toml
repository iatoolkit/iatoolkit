[project.optional-dependencies]
# Parsing a document with the Docling pipeline rather than the basic provider.
docling = [
    "docling==2.72.0",
]
# Reading a scanned PDF. This extra is NOT enough to do OCR: pytesseract only
# shells out to the tesseract binary, which pip cannot install. All three of
# these have to be true, and `_get_tesseract_status()` checks them in order:
#
#   1. TESSERACT_ENABLED=true      — off by default, so this extra alone
#                                    changes nothing at runtime
#   2. this extra installed        — the only gate pip covers
#   3. apt-get install tesseract-ocr tesseract-ocr-spa
#                                  — the binary, and the Spanish data pack,
#                                    because the call is image_to_string(lang="spa")
#
# Render's native Python runtime ships neither of the two system packages.
# Installed in CI because the two OCR assertions in test_document_service.py
# fake gates 1 and 3 but import pytesseract for real.
ocr = [
    "pytesseract==0.3.13",
]
# Running a model locally in `infra/inference_handler`, which imports both of
# these at module level. Nothing in the source loads that module today — only
# its own test does, by importlib — so treat these pins as untested: no code
# path has exercised diffusers at any version.
inference = [
    "torch==2.10.0",
    "diffusers==0.39.0",
]

# Installed by `uv sync` (uv syncs the `dev` group by default) but never shipped
# to anyone installing `iatoolkit`. This exists because two OCR assertions in
# test_document_service.py import pytesseract for real while faking the other two
# gates, so without it a clean `uv sync` leaves the suite failing on a missing
# optional extra rather than on anything a developer changed. Keep the pin in
# step with the `ocr` extra above.
#
# pytest and its plugins live here too, not in [project.dependencies]. They were
# runtime dependencies until now, which meant every deployment built with
# `uv sync --no-dev` still shipped them, and four downstream repositories were
# borrowing this package's test runner instead of declaring one.
[dependency-groups]
dev = [
  "pytesseract==0.3.13",
  "pytest>=8.3,<9",
  "pytest-cov>=5,<6",
  "pytest-mock>=3.14,<4",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["tests*", "*/tests*"]


[tool.setuptools.dynamic]
version = { attr = "iatoolkit.__version__" }

[tool.setuptools.package-data]
iatoolkit = ["templates/**/*", "static/**/*", "locales/*.yaml", "config/*.yaml", "config/system_prompts/*.prompt"]

# Declared so the suite behaves identically however it is launched. Before this,
# the layout worked only by accident: `src/tests/__init__.py` made pytest insert
# `src` on sys.path, and the documented command supplied `PYTHONPATH=./src` by
# hand. An IDE that ran pytest without that variable was relying on the accident,
# and a bare `pytest` from the repo root also walked `build/`.
#
# - testpaths: the suite lives in `src/tests`; nothing else is collected.
# - pythonpath: puts `src` on sys.path regardless of whether the project happens
#   to be installed in the environment, so a fresh checkout runs the tests.
[tool.pytest.ini_options]
testpaths = ["src/tests"]
pythonpath = ["src"]

name: IAToolkit Tests

on:
  push:
    branches:
      - master
      - develop
      - 'feature/**'
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          # Exact patch, matching .python-version and what Render runs. A bare
          # '3.12' let CI and production drift within the series.
          python-version: '3.13.15'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # uv sync installs from uv.lock, including the `dev` group that holds
          # pytest and its plugins. The hand-written `pip install pytest ...`
          # this replaces listed the tools one by one, so moving pytest-mock out
          # of [project.dependencies] left CI without the `mocker` fixture while
          # every local run stayed green.
          pip install uv==0.12.19
          uv sync --frozen

      - name: Run tests
        run: |
          uv run --no-sync pytest --maxfail=1 --disable-warnings -q

  # Known vulnerabilities in the runtime dependencies, from uv.lock (BL-034 R8).
  # Reported on every push; not blocking until the pinned versions with published
  # fixes are upgraded - then drop continue-on-error so a new one fails CI.
  audit:
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13.15'

      - name: Audit dependencies
        run: |
          pip install uv==0.12.19
          uv export --frozen --no-dev --no-emit-project --no-hashes --format requirements-txt -o requirements-audit.txt
          uvx --from pip-audit==2.10.1 pip-audit -r requirements-audit.txt --no-deps --disable-pip \
            --progress-spinner off --desc off -f markdown -o audit.md || rc=$?
          cat audit.md >> "$GITHUB_STEP_SUMMARY"
          exit ${rc:-0}

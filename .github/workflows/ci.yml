name: IAToolkit Tests

on:
  push:
    branches:
      - master
      - develop
      - 'feature/**'
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Exact patch, matching .python-version and what Render runs. A bare
          # '3.12' let CI and production drift within the series.
          python-version: '3.13.15'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # One install, not two: pyproject takes its dependencies from
          # requirements.txt through dynamic metadata, so installing the package
          # installs them. The separate `pip install -r requirements.txt || true`
          # this replaces was both redundant and silent — the `|| true` meant an
          # unresolvable dependency set passed CI without a word.
          #
          # `[ocr]` adds pytesseract. It is 40KB of pure Python, and without it
          # the two OCR assertions in test_document_service.py fail rather than
          # skip. Installing it here is the difference between the scanned-PDF
          # path being tested and merely being skipped.
          pip install -e '.[ocr]'
          pip install pytest pytest-cov

      - name: Run tests
        run: |
          pytest --maxfail=1 --disable-warnings -q

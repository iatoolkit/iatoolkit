name: IAToolkit Tests

on:
  push:
    branches:
      - master
      - develop
      - 'feature/**'
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Exact patch, matching .python-version and what Render runs. A bare
          # '3.12' let CI and production drift within the series.
          python-version: '3.13.15'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # uv sync installs from uv.lock, including the `dev` group that holds
          # pytest and its plugins. The hand-written `pip install pytest ...`
          # this replaces listed the tools one by one, so moving pytest-mock out
          # of [project.dependencies] left CI without the `mocker` fixture while
          # every local run stayed green.
          pip install uv==0.12.19
          uv sync --frozen

      - name: Run tests
        run: |
          uv run --no-sync pytest --maxfail=1 --disable-warnings -q

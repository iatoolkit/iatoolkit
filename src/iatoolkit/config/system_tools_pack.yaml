version: 2
pack:
  key: system
  name: System Tools
tools:
  - function_name: iat_generate_excel
    description: Generador de Excel.Genera un archivo Excel (.xlsx) a partir de una lista de diccionarios. Cada diccionario representa una fila del archivo. el archivo se guarda en storage.retorna diccionario con filename y attachment_token (para recuperar el archivo)content_type y download_link
    output_contract:
      kind: file
      mime_type: application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
      transport: signed_url
      url_field: download_link
      filename_field: filename
    routing_profile:
      tags:
        - excel
        - spreadsheet
        - xlsx
        - export
        - report
      intents:
        - Generate an Excel file from structured row data.
        - Export tabular results to xlsx.
      examples:
        - iat_generate_excel(filename="reporte.xlsx", sheet_name="Ventas", data=[{"cliente":"ACME","monto":1200}])
        - iat_generate_excel(filename="resumen.xlsx", sheet_name="Resumen", data=[{"kpi":"ingresos","value":32000}])
      cost:
        penalty: 0.15
        latency_class: medium
        expensive: false
    parameters:
      type: object
      properties:
        filename:
          type: string
          description: "Nombre del archivo de salida (ejemplo: 'reporte.xlsx')"
          pattern: ^.+\.xlsx?$
        sheet_name:
          type: string
          description: Nombre de la hoja dentro del Excel
          minLength: 1
        data:
          type: array
          description: Lista de diccionarios. Cada diccionario representa una fila.
          minItems: 1
          items:
            type: object
            properties: {}
            additionalProperties:
              anyOf:
                - type: string
                - type: number
                - type: boolean
                - type: "null"
                - type: string
                  format: date
      required:
        - filename
        - sheet_name
        - data
  - function_name: iat_generate_pdf
    description: Generador de PDF. Convierte contenido HTML o Markdown en un archivo PDF descargable. El archivo se guarda en storage y retorna filename, attachment_token, content_type y download_link.
    output_contract:
      kind: file
      mime_type: application/pdf
      transport: signed_url
      url_field: download_link
      filename_field: filename
    routing_profile:
      tags:
        - pdf
        - document
        - export
        - report
        - markdown
      intents:
        - Generate a PDF file from markdown or HTML content.
        - Export a textual report to a downloadable PDF document.
      examples:
        - iat_generate_pdf(filename="informe.pdf", content="# Resumen\\n\\nTodo OK", input_format="markdown", template="report", page_size="A4", orientation="portrait")
        - iat_generate_pdf(filename="carta.pdf", content="<h1>Carta</h1><p>Contenido</p>", input_format="html", template="letter", page_size="LETTER", orientation="portrait")
      cost:
        penalty: 0.18
        latency_class: medium
        expensive: false
    parameters:
      type: object
      properties:
        filename:
          type: string
          description: "Nombre del archivo de salida (ejemplo: 'informe.pdf')"
          pattern: ^.+\.pdf$
        content:
          type: string
          description: Contenido fuente del documento en formato Markdown o HTML.
          minLength: 1
        input_format:
          type: string
          description: Formato del contenido de entrada.
          enum:
            - markdown
            - html
        template:
          type: string
          description: Plantilla visual base del PDF.
          enum:
            - simple
            - report
            - letter
        page_size:
          type: string
          description: Tamaño de página del PDF.
          enum:
            - A4
            - LETTER
        orientation:
          type: string
          description: Orientación de la página.
          enum:
            - portrait
            - landscape
      required:
        - filename
        - content
        - input_format
        - template
        - page_size
        - orientation
  - function_name: iat_send_email
    description: iatoolkit mail system. envia mails cuando un usuario lo solicita.
    # Sends a real email: simulated, never sent, when an evaluation replays an agent.
    # Not destructive (it changes nothing that existed) and not open-world for MCP
    # annotations: it goes through the tenant's own mail service.
    execution_config:
      side_effects: true
      destructive: false
    routing_profile:
      tags:
        - email
        - mail
        - notification
        - delivery
      intents:
        - Send an email to a recipient with HTML body.
        - Deliver notifications with optional attachments.
      examples:
        - iat_send_email(recipient="cliente@acme.com", subject="Estado", body="<p>Listo</p>", attachments=[])
        - iat_send_email(recipient="ops@acme.com", subject="Reporte", body="<p>Adjunto</p>", attachments=[{"filename":"reporte.pdf","content":"...","attachment_token":"tok_123"}])
      cost:
        penalty: 0.2
        latency_class: medium
        expensive: false
    parameters:
      type: object
      properties:
        recipient:
          type: string
          description: email del destinatario
        subject:
          type: string
          description: asunto del email
        body:
          type: string
          description: HTML del email
        attachments:
          type: array
          description: Lista de archivos adjuntos codificados en base64
          items:
            type: object
            properties:
              filename:
                type: string
                description: Nombre del archivo con su extensión (ej. informe.pdf)
              content:
                type: string
                description: Contenido del archivo en b64.
              attachment_token:
                type: string
                description: token para descargar el archivo.
            required:
              - filename
              - content
              - attachment_token
            additionalProperties: false
      required:
        - recipient
        - subject
        - body
        - attachments
  - function_name: iat_sql_query
    description: "Servicio SQL de IAToolkit: debes utilizar este servicio para todas las consultas SQL a bases de datos."
    routing:
      force_include_capability: has_sql_sources
    routing_profile:
      tags:
        - sql
        - database
        - query
        - analytics
        - reporting
      intents:
        - Query a configured SQL database.
        - Retrieve business data through SQL statements.
      examples:
        - iat_sql_query(database_key="erp", query="SELECT * FROM customers LIMIT 10")
        - iat_sql_query(database_key="dwh", query="SELECT date, sum(total) FROM sales GROUP BY date")
      cost:
        penalty: 0.25
        latency_class: high
        expensive: true
    parameters:
      type: object
      properties:
        database_key:
          type: string
          description: "IMPORTANT: nombre de la base de datos a consultar."
        query:
          type: string
          description: string con la consulta en sql
      required:
        - database_key
        - query
  - function_name: iat_document_search
    description: Búsqueda semántica sobre documentos internos de la empresa para traer contexto adicional cuando haga falta. No usar si el usuario pide trabajar exclusivamente con un archivo ya adjunto en el turno actual. Usa metadata_filter solo cuando el usuario o el contexto indiquen un filtro de metadata concreto y necesario; si no hace falta, envía null.
    routing:
      force_include_capability: has_kb_collections
    routing_profile:
      tags:
        - document
        - search
        - semantic
        - knowledge
        - retrieval
      intents:
        - Search text chunks in company document collections.
        - Retrieve relevant context from internal documents.
        - Use only when the answer needs extra internal documents beyond the current conversation and current attachments.
        - Use metadata_filter only when a specific metadata constraint is explicitly needed; otherwise send null.
      examples:
        - iat_document_search(query="política de devoluciones", collection="Atencion", metadata_filter=null)
        - iat_document_search(query="editoriales de las publicaciones", collection="papers", metadata_filter=null)
        - iat_document_search(query="fecha de vencimiento contrato", collection="Legal", metadata_filter=[{"key":"doc.type","value":"contract"}])
      cost:
        penalty: 0.12
        latency_class: medium
        expensive: false
    parameters:
      type: object
      properties:
        query:
          type: string
          description: Texto o pregunta a buscar en documentos internos adicionales. No usar para releer un archivo que ya fue adjuntado al turno actual.
        collection:
          anyOf:
            - type: string
            - type: "null"
            - type: array
              items:
                type: string
          description: "Opcional. Colección o lista de colecciones donde buscar. Usa null, \"\" o [] para buscar en todas."
        metadata_filter:
          anyOf:
            - type: "null"
            - type: array
              items:
                type: object
                properties:
                  key:
                    type: string
                    description: "Clave del filtro (ej: doc.type, chunk.source_type, image.page)."
                  value:
                    anyOf:
                      - type: string
                      - type: number
                      - type: boolean
                      - type: "null"
                    description: Valor escalar del filtro.
                required:
                  - key
                  - value
                additionalProperties: false
          description: "Opcional en la práctica. Usa null cuando no necesites filtrar por metadata. No inventes filtros ni envíes [] por defecto. Ejemplo: [{'key':'doc.type','value':'invoice'},{'key':'chunk.source_type','value':'table'}]."
        keywords:
          anyOf:
            - type: "null"
            - type: string
            - type: array
              items:
                type: string
          description: "Opcional. Términos exactos que deben aparecer en el texto: códigos, números de contrato, RUT, nombres propios o siglas (ej. [\"AX-2241\", \"Pérez\"]). La búsqueda combina el significado de `query` con estos términos. Usa null si la pregunta no tiene términos exactos."
      required:
        - query
  - function_name: iat_document_list
    description: Lista los documentos de una colección de la empresa con su ficha (título, resumen, tipo, vigencia), del más reciente al más antiguo. Úsala para preguntas de catálogo ("¿qué contratos tenemos?", "¿cuál es la lista de precios vigente?", "¿qué hay en la carpeta Comercial?"), no para buscar un dato dentro de los documentos (para eso, `iat_document_search`). Los documentos reemplazados u obsoletos no aparecen salvo que lo pidas.
    routing:
      force_include_capability: has_kb_collections
    routing_profile:
      tags:
        - document
        - catalog
        - list
        - knowledge
      intents:
        - List the documents of a company collection with their cards.
        - Find which documents exist of a given type, or which one is valid today.
      examples:
        - iat_document_list(collection="comercial", document_type="contrato")
        - iat_document_list(collection="legal", valid_on="2026-10-14")
      cost:
        penalty: 0.05
        latency_class: low
        expensive: false
    parameters:
      type: object
      properties:
        collection:
          anyOf:
            - type: string
            - type: "null"
          description: Colección a listar (su nombre exacto). null lista todas.
        document_type:
          anyOf:
            - type: string
            - type: "null"
          description: Opcional. Tipo de documento según su ficha (ej. contrato, política, lista de precios, procedimiento).
        text:
          anyOf:
            - type: string
            - type: "null"
          description: Opcional. Texto a buscar en el nombre, título, resumen o palabras clave de la ficha.
        valid_on:
          anyOf:
            - type: string
            - type: "null"
          description: Opcional. Fecha YYYY-MM-DD; deja los documentos vigentes ese día o sin vigencia indicada.
        include_inactive:
          type: boolean
          description: Incluir documentos reemplazados u obsoletos. Por defecto false.
        limit:
          type: integer
          description: Cuántos documentos devolver (máximo 100). Por defecto 30.
        offset:
          type: integer
          description: Desde qué posición seguir (usa next_offset de la respuesta anterior).
      required:
        - collection
  - function_name: iat_document_read
    description: Lee el texto de un documento de la empresa, completo o por partes, con su ficha. Úsala cuando la respuesta necesite el documento entero (resumirlo, compararlo, revisar todas sus cláusulas) y no solo los fragmentos que trae `iat_document_search`. El document_id viene de `iat_document_search` o `iat_document_list`. Si la respuesta trae has_more=true, sigue con offset=next_offset.
    routing:
      force_include_capability: has_kb_collections
    routing_profile:
      tags:
        - document
        - read
        - knowledge
      intents:
        - Read a whole company document, or a part of it, by id.
        - Summarize or compare full documents.
      examples:
        - iat_document_read(document_id=42)
        - iat_document_read(document_id=42, offset=20000)
      cost:
        penalty: 0.1
        latency_class: medium
        expensive: false
    parameters:
      type: object
      properties:
        document_id:
          type: integer
          description: Identificador del documento, devuelto por `iat_document_search` o `iat_document_list`.
        offset:
          type: integer
          description: Desde qué carácter leer. Por defecto 0.
        limit:
          type: integer
          description: Cuántos caracteres leer (máximo 60000). Por defecto 20000.
      required:
        - document_id
  - function_name: iat_wiki_search
    description: Busca páginas publicadas dentro de las wikis de conocimiento compartidas por la empresa. Úsala como acelerador cuando necesites encontrar rápidamente una página relevante, pero no como punto de entrada por defecto. Si no conoces un `path` válido, primero llama `iat_wiki_get_page` con `path="/"` para leer el índice raíz de la wiki y seguir sus links exactos. `wiki_key` es el identificador estable de una wiki publicada, por ejemplo `sales`, `ops` o `hr`; úsalo cuando ya sepas en qué wiki buscar y omítelo cuando quieras buscar en todas las wikis publicadas disponibles en esta conexión MCP. Esta tool devuelve candidatos; luego usa `iat_wiki_get_page` para leer la página completa antes de responder. Cada candidato trae `url`, el link para abrir la página en el navegador.
    routing:
      force_include_capability: has_knowledge_wikis
    routing_profile:
      tags:
        - knowledge_wiki
        - company_knowledge
        - tenant_context
        - playbook
        - policy
        - process
        - runbook
        - onboarding
        - wiki
      intents:
        - Search curated company wiki pages when direct lookup is faster than browsing the root index.
        - Find the relevant company wiki page after the user asks about internal procedures, policies, or runbooks.
        - Narrow down which exact page to open with iat_wiki_get_page.
      examples:
        - iat_wiki_search(query="politica de descuentos enterprise", wiki_key="sales", limit=5)
        - iat_wiki_search(query="como escalar incidentes sev1", wiki_key="ops", limit=3)
        - iat_wiki_search(query="onboarding de nuevos ejecutivos", limit=5)
      cost:
        penalty: 0.09
        latency_class: low
        expensive: false
    parameters:
      type: object
      properties:
        query:
          type: string
          description: Consulta en lenguaje natural sobre políticas, playbooks, procesos, runbooks o conocimiento curado publicado en las wikis del tenant.
        wiki_key:
          anyOf:
            - type: string
            - type: "null"
          description: Clave estable de la wiki publicada, por ejemplo `sales`, `ops` o `hr`. Debe coincidir con el `wiki_key` expuesto por el catálogo/resource. Usa null para buscar en todas las wikis publicadas disponibles.
        limit:
          type: integer
          description: Cantidad máxima de páginas candidatas a recuperar antes de elegir una para leer completa.
          minimum: 1
          maximum: 25
      required:
        - query
        - limit
  - function_name: iat_wiki_get_page
    description: |-
      Wiki entrypoint: llama `iat_wiki_get_page` con `path="/"` para cargar el índice raíz de una wiki de conocimiento publicada del tenant.
      Lee **una** página de wiki y devuelve su contenido en Markdown. La wiki documenta contexto de negocio, áreas, sistemas internos, arquitectura, procesos, políticas, runbooks, onboarding, operaciones y glosarios. Es una wiki navegable por links: la página raíz `path="/"` es el punto de entrada y lista las páginas disponibles con sus paths exactos; después abre solo las páginas relevantes siguiendo esos links o los paths devueltos por iat_wiki_search (solo si esta habilitada).
      `wiki_key` identifica la wiki publicada. Los `path` son sensibles a mayúsculas y deben coincidir EXACTAMENTE con el link o path publicado; no los inventes ni los reconstruyas de memoria. Si no conoces un path válido, vuelve a llamar con `path="/"`. Esta tool es de solo lectura y es segura de usar siempre que la documentación interna de la empresa ayude a responder. Prefiere abrir pocas páginas puntuales antes de recorrer el corpus completo. Cuando respondas usando material de la wiki, cita la página usada; si trae `url`, cítala como link con esa URL exacta.
    routing:
      force_include_capability: has_knowledge_wikis
    routing_profile:
      tags:
        - knowledge_wiki
        - company_knowledge
        - tenant_context
        - page
        - markdown
        - wiki
        - entrypoint
        - index
        - root
        - internal_docs
      intents:
        - Load the root index of a tenant knowledge wiki with path="/".
        - Open a published tenant wiki page by exact path or slug.
        - Read the full markdown content of a company knowledge page before answering.
        - Follow links from the root index or another wiki page to retrieve the exact page content.
      examples:
        - iat_wiki_get_page(wiki_key="kb-integrated", path="/")
        - iat_wiki_get_page(wiki_key="kb-integrated", path="commercial/README-commercial.md")
      cost:
        penalty: 0.01
        latency_class: low
        expensive: false
    parameters:
      type: object
      properties:
        wiki_key:
          type: string
          description: Clave estable de la wiki publicada, por ejemplo `kb-integrated`.
        path:
          type: string
          description: Usa `"/"` para leer el índice raíz de la wiki. En cualquier otro caso, envía el path o slug exacto de la página dentro de esa wiki, idealmente uno listado en el índice raíz o devuelto por `iat_wiki_search` (si esta disponible).
      required:
        - wiki_key
        - path
  - function_name: iat_memory_search
    description: Busca en la Memoria de la empresa, el conocimiento de cómo se hacen las cosas en esta empresa que su gente fue guardando (procedimientos, reglas, excepciones, quién decide, correcciones a documentos). Devuelve páginas con título, resumen y fuentes. Incluye la señal `has_native_files` cuando una página tiene archivos fuente que pueden adjuntarse nativamente al modelo. Úsala antes de responder cómo se hace algo en la empresa, o cuando la pregunta dependa de prácticas internas que podrían no estar en los documentos.
    routing:
      force_include_capability: has_user_memory
    routing_profile:
      tags:
        - memory
        - company_memory
        - know_how
        - procedures
        - internal_practices
        - corrections
        - saved_content
        - wiki
      intents:
        - Search the company memory for how things are done here.
        - Retrieve internal procedures, rules, exceptions and who decides, as people in the company explained them.
        - Check whether people corrected or completed what a company document says.
        - Use this before answering how something is done in this company.
      examples:
        - iat_memory_search(query="cómo se emite una nota de crédito", limit=5)
        - iat_memory_search(query="despachos a regiones los viernes", limit=3)
        - iat_memory_search(query="quién aprueba descuentos sobre 10%", limit=5)
        - iat_memory_search(query="plazo real de pago de clientes grandes", limit=5)
      cost:
        penalty: 0.08
        latency_class: medium
        expensive: false
    parameters:
      type: object
      properties:
        query:
          type: string
          description: Texto que describe lo que deseas recuperar desde la Memoria de la empresa.
        limit:
          type: integer
          description: Cantidad máxima de páginas a recuperar.
          minimum: 1
          maximum: 10
      required:
        - query
        - limit
  - function_name: iat_memory_get_page
    description: Recupera una página completa de la Memoria de la empresa, en markdown, con autor y fecha de cada dato y sus fuentes. Si la página proviene de capturas con archivos adjuntos compatibles, esos archivos pueden quedar adjuntos nativamente al turno actual del modelo para inspección directa; en ese caso no hace falta pedir permiso para abrir un access_url temporal. Si `iat_memory_search` devuelve `has_native_files=true` y la respuesta depende del contenido del archivo, debes llamar esta tool antes de responder.
    routing:
      force_include_capability: has_user_memory
    routing_profile:
      tags:
        - memory
        - company_memory
        - page
        - wiki
      intents:
        - Open a company memory page by id.
        - Read the full content of a company memory page before answering.
      examples:
        - iat_memory_get_page(page_id=12)
      cost:
        penalty: 0.05
        latency_class: medium
        expensive: false
    parameters:
      type: object
      properties:
        page_id:
          type: integer
          description: Identificador de la página de la Memoria de la empresa, devuelto por `iat_memory_search`.
      required:
        - page_id
  - function_name: iat_memory_save
    description: Guarda en la Memoria de la empresa algo que el usuario explicó sobre cómo se hacen las cosas en la empresa (un procedimiento, una regla, una excepción, quién decide) o una corrección a lo que dice un documento o a una respuesta tuya. Lo verá TODA la empresa, con el nombre del usuario y la fecha, y se publica de inmediato. Úsala solo cuando el usuario pida guardarlo ("guarda esto", "que lo sepa la empresa") o acepte cuando le ofreces guardarlo tras corregirte. Antes de llamarla, dile al usuario que lo verá toda la empresa. Redacta `content` en tono neutro e impersonal, con solo el conocimiento útil, sin datos personales ni sensibles que no sirvan al procedimiento. No la uses para preferencias o recordatorios personales.
    # Publishes to the whole company: simulated when an evaluation replays an
    # agent, and marked as a write for MCP clients so they ask the user first.
    execution_config:
      side_effects: true
      destructive: false
    routing:
      force_include_capability: has_user_memory
    routing_profile:
      tags:
        - memory
        - company_memory
        - save
        - capture
        - know_how
        - corrections
      intents:
        - Save what the user explained about how things are done in the company.
        - Save a correction the user made to a document or to an answer.
        - Use only when the user asks to save it or accepts the offer to save it.
      examples:
        - iat_memory_save(content="Al cliente Transportes Sur no se le despacha los viernes; la bodega cierra temprano ese día.", title="Despachos a Transportes Sur")
        - iat_memory_save(content="Las notas de crédito las aprueba Andrea Rojas; si no está, la gerencia.", title="Aprobación de notas de crédito")
      cost:
        penalty: 0.1
        latency_class: medium
        expensive: false
    parameters:
      type: object
      properties:
        content:
          type: string
          description: El conocimiento a guardar, redactado en tono neutro, completo y autocontenido (debe entenderse sin la conversación).
        title:
          type: string
          description: Título corto del tema, por ejemplo "Notas de crédito".
      required:
        - content
        - title
  - function_name: iat_image_search
    description: Busca imágenes en la base de conocimiento visual de la empresa usando una descripción de texto. Útil cuando el usuario pide 'ver' algo, 'muéstrame una foto de...', o busca gráficos y diagramas.
    routing:
      force_include_capability: has_kb_collections
    routing_profile:
      tags:
        - image
        - visual
        - search
        - media
        - retrieval
      intents:
        - Search images by textual description in company collections.
        - Find photos, charts, or diagrams related to a query.
      examples:
        - iat_image_search(query="foto de fachada principal", collection="Marketing", metadata_filter=[])
        - iat_image_search(query="diagrama de arquitectura", collection="Tecnologia", metadata_filter=[{"key":"doc.type","value":"diagram"}])
      cost:
        penalty: 0.13
        latency_class: medium
        expensive: false
    parameters:
      type: object
      properties:
        query:
          type: string
          description: "Descripción detallada de la imagen que se busca (ej: 'foto de la fachada del edificio')."
        collection:
          type: string
          description: "Opcional. Nombre de la colección donde buscar (ej: 'Planos', 'Marketing')."
        metadata_filter:
          type: array
          description: "Opcional. Filtros de metadata como lista de pares key/value. Ejemplo: [{'key':'doc.type','value':'invoice'},{'key':'image.page','value':1}]."
          items:
            type: object
            properties:
              key:
                type: string
                description: "Clave del filtro (ej: doc.type, image.page, image.caption_text)."
              value:
                anyOf:
                  - type: string
                  - type: number
                  - type: boolean
                  - type: "null"
                description: Valor escalar del filtro.
            required:
              - key
              - value
            additionalProperties: false
      required:
        - query
        - collection
        - metadata_filter
  - function_name: iat_visual_search
    description: Busca imágenes visualmente similares a una imagen adjunta por el usuario (búsqueda por similitud visual). Si el usuario adjunta una imagen y solicita buscar algo similar debes utilizar este servicio.
    routing:
      force_include_capability: has_kb_collections
    routing_profile:
      tags:
        - visual
        - similarity
        - image
        - search
        - multimodal
      intents:
        - Find visually similar images to an attached reference image.
        - Perform similarity search across company visual knowledge base.
      examples:
        - iat_visual_search(image_index=0, n_results=3, collection="Marketing", metadata_filter=[])
        - iat_visual_search(image_index=1, n_results=5, collection="Planos", metadata_filter=[{"key":"doc.type","value":"blueprint"}])
      cost:
        penalty: 0.16
        latency_class: medium
        expensive: false
    parameters:
      type: object
      properties:
        image_index:
          type: integer
          description: Opcional. Índice (0-based) de la imagen adjunta a usar. Por defecto es 0 (la primera imagen).
        n_results:
          type: integer
          description: Cantidad de resultados a devolver (por defecto 3).
          minimum: 1
          maximum: 5
        collection:
          type: string
          description: "Opcional. Nombre de la colección donde buscar (ej: 'Planos', 'Marketing')."
        metadata_filter:
          type: array
          description: "Opcional. Filtros de metadata como lista de pares key/value. Ejemplo: [{'key':'doc.type','value':'invoice'},{'key':'image.caption_text','value':'logo'}]."
          items:
            type: object
            properties:
              key:
                type: string
                description: "Clave del filtro (ej: doc.type, image.caption_text)."
              value:
                anyOf:
                  - type: string
                  - type: number
                  - type: boolean
                  - type: "null"
                description: Valor escalar del filtro.
            required:
              - key
              - value
            additionalProperties: false
      required:
        - n_results
        - image_index
        - collection
        - metadata_filter
  - function_name: iat_web_search
    description: Realiza una búsqueda web externa para obtener información pública actualizada.
    # Reaches the public internet: openWorldHint in MCP annotations.
    execution_config:
      open_world: true
    routing_profile:
      tags:
        - web
        - internet
        - search
        - public
        - recency
      intents:
        - Search public web sources for updated information.
        - Retrieve recent external references from the internet.
      examples:
        - iat_web_search(query="últimas noticias de economía en Chile")
        - iat_web_search(query="release notes python 3.13")
      cost:
        penalty: 0.09
        latency_class: medium
        expensive: false
    parameters:
      type: object
      properties:
        query:
          type: string
          description: Texto de búsqueda.
      required:
        - query
